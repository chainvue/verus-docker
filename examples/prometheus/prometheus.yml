# Prometheus configuration for the verus-docker monitoring overlay.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: verus
    static_configs:
      - targets:
          - verus-exporter:9838
    # The exporter caches for a few seconds, so a shorter interval buys nothing.
    scrape_interval: 30s
    scrape_timeout: 20s

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
