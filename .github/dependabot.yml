version: 2

updates:
  # Actions are pinned to commit SHAs, not tags: a tag is mutable, so anyone who
  # compromises an action repository could repoint v4 at new code and every
  # workflow would pick it up. Dependabot understands SHA pins and rewrites both
  # the SHA and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  # The node image base. Note that a base image REBUILD is handled separately by
  # .github/workflows/rebuild.yml — Dependabot only sees tag changes, not a
  # moved digest behind the same tag.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, base-image]
    commit-message:
      prefix: fix

  # The exporter's Python base image.
  - package-ecosystem: docker
    directory: "/exporter"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, exporter]
    commit-message:
      prefix: fix
