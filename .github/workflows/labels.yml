name: Sync labels

# Keeps the repository's labels in step with .github/labels.yml, so the
# path-based labeler always has labels to apply.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5.3.0
        with:
          yaml-file: .github/labels.yml
          # Never delete labels that are not in the file: maintainers add
          # ad-hoc ones and losing them silently would be rude.
          skip-delete: true
