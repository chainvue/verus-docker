name: Release

# Releases are built only here, only from a tag. Never build and push an image
# from a workstation: a tag must correspond to exactly one set of bits, and the
# provenance attestation is what lets users verify that.
on:
  push:
    tags:
      - "v*"

# Least privilege by default; each job below widens only what it needs.
# `attestations: write` is deliberately absent — provenance and SBOMs here come
# from buildx OCI referrers plus cosign, not the GitHub attestations API.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Prove the tag is well formed and matches what the Dockerfile actually pins,
  # before anything is built or published.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upstream: ${{ steps.check.outputs.upstream }}
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Expected shape: v<upstream>-r<N>, e.g. v1.2.17-2-r1
          if [[ ! "$tag" =~ ^(v.+)-r([0-9]+)$ ]]; then
            echo "::error::tag '${tag}' does not match v<upstream-version>-r<N>"
            exit 1
          fi
          upstream="${BASH_REMATCH[1]}"
          revision="${BASH_REMATCH[2]}"

          pinned="$(scripts/next-version.sh --upstream)"
          if [[ "$upstream" != "$pinned" ]]; then
            echo "::error::tag says upstream ${upstream} but the Dockerfile pins ${pinned}"
            exit 1
          fi

          # The tag must point at a commit that is actually on main.
          #
          # Without this, anyone who can push a tag can have CI build, cosign-sign
          # and publish an arbitrary commit to `latest` — and `cosign verify` would
          # pass, because the assertion it makes is "built by this repo's release
          # workflow", which would be entirely true. Tag protection in the
          # repository settings is the other half of this; see
          # docs/maintainers/repository-setup.md.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '${tag}' points at ${GITHUB_SHA}, which is not on main"
            echo "::error::Releases are only ever cut from reviewed commits on main."
            exit 1
          fi

          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "tag ${tag} is consistent with the Dockerfile and is on main"

  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test before publishing
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: verus-docker:release-candidate
          build-args: |
            IMAGE_REVISION=r${{ needs.verify-tag.outputs.revision }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/zcash-params
          key: zcash-params-${{ hashFiles('rootfs/usr/local/lib/verus/params.sh') }}

      - name: Smoke test
        env:
          IMAGE: verus-docker:release-candidate
          PARAMS_DIR: /tmp/zcash-params
          RPC_TIMEOUT_SECONDS: "420"
        run: bash scripts/smoke-test.sh

  # ---------------------------------------------------------------------------
  publish:
    name: Build, sign and publish
    needs: [verify-tag, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing via OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag fan-out (note the `v` on the moving upstream tag — it is derived
      # from the pushed tag, so it carries the prefix; docs, Helm and the
      # cosign examples all reference it in that form):
      #   v1.2.17-2-r1  immutable, never moves       <- the tag being pushed
      #   v1.2.17-2     newest rN for that upstream  <- moves
      #   latest        newest stable overall        <- moves
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ needs.verify-tag.outputs.upstream }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_REVISION=r${{ needs.verify-tag.outputs.revision }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Keyless signing: the signature is bound to this workflow's identity via
      # OIDC, so there is no private key to leak or rotate.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [[ -n "$tag" ]] || continue
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done <<< "$TAGS"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  # ---------------------------------------------------------------------------
  # The exporter ships as its own image because the Helm chart runs it as a
  # sidecar and the compose overlay pulls it. It rides the node's tag scheme so
  # a given release is one coherent set.
  # ---------------------------------------------------------------------------
  publish-exporter:
    name: Build, sign and publish the exporter
    needs: [verify-tag, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing via OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/verus-exporter
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ needs.verify-tag.outputs.upstream }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_REVISION=r${{ needs.verify-tag.outputs.revision }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [[ -n "$tag" ]] || continue
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done <<< "$TAGS"

      # The exporter gets the same treatment as the node image. For releases r1
      # through r10 it did not: it was signed but never had an attached SBOM,
      # which made LICENSING.md's "every release ships an SPDX SBOM" false for
      # exactly one of the two images we publish.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/verus-exporter@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-exporter.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes --predicate sbom-exporter.spdx.json --type spdxjson \
            "${REGISTRY}/${{ github.repository_owner }}/verus-exporter@${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-exporter
          path: sbom-exporter.spdx.json

  # ---------------------------------------------------------------------------
  # A matrix rather than two jobs, so the exporter cannot quietly fall out of
  # the security pipeline again — it shipped unscanned from r1 to r10 because
  # this job named one image explicitly.
  scan:
    name: Vulnerability scan (${{ matrix.name }})
    needs: [publish, publish-exporter]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node
            ref: ${{ needs.publish.outputs.digest }}
            repo: verus-docker
          - name: exporter
            ref: ${{ needs.publish-exporter.outputs.digest }}
            repo: verus-exporter
    steps:
      # Trivy pulls the image from the registry, so it needs credentials.
      # Without this it fails with UNAUTHORIZED against a private package —
      # and a package is private until someone makes it public by hand.
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs after publishing on purpose. Holding the release hostage to a
      # newly disclosed CVE in a base image would block security updates to
      # verusd itself, which is usually the more urgent thing. A critical
      # finding fails this job loudly and the fix ships as the next -rN.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.repo }}@${{ matrix.ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}

      - name: Fail on critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.repo }}@${{ matrix.ref }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub release
    needs: [verify-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the SBOM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Compose release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Image

          \`\`\`
          docker pull ${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}
          \`\`\`

          | Tag | Meaning |
          | --- | --- |
          | \`${GITHUB_REF_NAME}\` | This exact build. Immutable — use this in production. |
          | \`${{ needs.verify-tag.outputs.upstream }}\` | Newest image revision for this upstream version. Moves. |
          | \`latest\` | Newest stable release. Moves. |

          Upstream daemon: **${{ needs.verify-tag.outputs.upstream }}**
          Digest: \`${{ needs.publish.outputs.digest }}\`

          ## Verifying this release

          \`\`\`bash
          cosign verify ${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME} \\
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          An SPDX SBOM is attached to this release and attested to the image.

          ## Upgrading

          Stop the node, back up \`wallet.dat\`, change the tag, start it again.
          Check the upstream release notes below for any required reindex.
          EOF

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: sbom.spdx.json
          fail_on_unmatched_files: true
