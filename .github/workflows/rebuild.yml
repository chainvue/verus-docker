name: Weekly rebuild

# Base image security patches have to reach users. A published image is frozen
# bits: if debian:bookworm-slim gets a fix, our image only gets it when we
# rebuild. This checks weekly whether the base digest moved and, if so, opens a
# PR bumping only the -rN revision.
#
# It opens a PR rather than tagging directly, so every published image still
# corresponds to a reviewed commit.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-base-image:
    name: Check the base image digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Re-resolve the pinned base image digests
        id: base
        run: |
          set -euo pipefail
          changed=0

          deb_tag="$(sed -n 's/^ARG DEBIAN_TAG=//p' Dockerfile | head -1)"
          deb_old="$(sed -n 's/^ARG DEBIAN_DIGEST=//p' Dockerfile | head -1)"
          deb_new="$(docker buildx imagetools inspect "debian:${deb_tag}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"

          py_tag="$(sed -n 's/^ARG PYTHON_TAG=//p' exporter/Dockerfile | head -1)"
          py_old="$(sed -n 's/^ARG PYTHON_DIGEST=//p' exporter/Dockerfile | head -1)"
          py_new="$(docker buildx imagetools inspect "python:${py_tag}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"

          for d in "$deb_new" "$py_new"; do
            case "$d" in
              sha256:*) ;;
              *) echo "::error::could not resolve a base image digest"; exit 1 ;;
            esac
          done

          if [ "$deb_new" != "$deb_old" ]; then
            sed -i "s|^ARG DEBIAN_DIGEST=.*|ARG DEBIAN_DIGEST=${deb_new}|" Dockerfile
            changed=1
          fi
          if [ "$py_new" != "$py_old" ]; then
            sed -i "s|^ARG PYTHON_DIGEST=.*|ARG PYTHON_DIGEST=${py_new}|" exporter/Dockerfile
            changed=1
          fi

          {
            echo "changed=${changed}"
            echo "deb_tag=${deb_tag}"
            echo "deb_old=${deb_old}"
            echo "deb_new=${deb_new}"
            echo "py_tag=${py_tag}"
            echo "py_old=${py_old}"
            echo "py_new=${py_new}"
          } >> "$GITHUB_OUTPUT"

      - name: Did anything move?
        id: compare
        run: |
          if [ "${{ steps.base.outputs.changed }}" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Base images are unchanged; nothing to do."
          fi

      - name: Work out the next revision
        if: steps.compare.outputs.changed == 'true'
        id: version
        run: echo "next=$(bash scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: rebuild/base-image
          base: main
          title: "fix: rebuild against a patched base image"
          labels: |
            base-image
            dependencies
          delete-branch: true
          add-paths: |
            Dockerfile
            exporter/Dockerfile
          body: |
            A pinned base image digest moved, so the published images are missing
            whatever was patched in it.

            | Image | Was | Now |
            | --- | --- | --- |
            | `debian:${{ steps.base.outputs.deb_tag }}` | `${{ steps.base.outputs.deb_old }}` | `${{ steps.base.outputs.deb_new }}` |
            | `python:${{ steps.base.outputs.py_tag }}` | `${{ steps.base.outputs.py_old }}` | `${{ steps.base.outputs.py_new }}` |

            Rows where the two columns match were not touched by this PR.

            The daemon version is unchanged. Merge this and tag
            **`${{ steps.version.outputs.next }}`** to publish the rebuilt images.

            Nothing is published until that tag is pushed.
