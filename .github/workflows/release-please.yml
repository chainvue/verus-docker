name: Release Please

# release-please maintains CHANGELOG.md and opens a release pull request from
# Conventional Commits. It deliberately does NOT own the version or create the
# GitHub release.
#
# Why: our tags are v<verusd-version>-rN, which has no semver equivalent
# release-please can express. Version selection lives in
# scripts/next-version.sh; tagging is a deliberate human step documented in
# docs/maintainers/releasing.md. Pushing that tag is what triggers release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
