{{- /*
  Gated on either field being set, not just the username. Gating on the
  username alone meant that setting rpcAuth.password on its own rendered no
  Secret at all: no error, no warning, and the entrypoint quietly generated
  random credentials instead of using the one the operator supplied.
*/ -}}
{{- if and (not .Values.rpcAuth.existingSecret) (or .Values.rpcAuth.username .Values.rpcAuth.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "verus-node.secretName" . }}
  labels:
    {{- include "verus-node.labels" . | nindent 4 }}
type: Opaque
stringData:
  RPC_USER: {{ required "rpcAuth.username is required when rpcAuth.password is set" .Values.rpcAuth.username | quote }}
  RPC_PASSWORD: {{ required "rpcAuth.password is required when rpcAuth.username is set" .Values.rpcAuth.password | quote }}
{{- end }}
