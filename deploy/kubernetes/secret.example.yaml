# EXAMPLE ONLY — do not commit a real Secret.
#
# Generate credentials and create the Secret imperatively instead:
#
#   kubectl create secret generic verus-rpc \
#     --from-literal=RPC_USER="verus_$(openssl rand -hex 4)" \
#     --from-literal=RPC_PASSWORD="$(openssl rand -hex 32)"
#
# Or manage it with SealedSecrets / External Secrets / SOPS. If you omit the
# Secret entirely, the entrypoint generates random credentials on first start
# and writes them into the data volume — fine for a single self-contained node,
# awkward when another workload needs to authenticate against it.
apiVersion: v1
kind: Secret
metadata:
  name: verus-rpc
  labels:
    app.kubernetes.io/name: verus
type: Opaque
stringData:
  RPC_USER: "replace-me"
  RPC_PASSWORD: "replace-me-with-32-random-bytes-hex"
